[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
# Тестирование
testcontainers = "1.21.3"
telegram-bots = "8.0.0"
wiremock = "3.13.1"
awaitility = "4.3.0"
resilience4j = "2.4.0"

[libraries]
# Spring Boot Starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Spring Core (нужны для application и infrastructure без тяжелого Web/JPA)
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }

# Metrics
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Resilience4j (Rate Limiting, Retry, Circuit Breaker)
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer", version.ref = "resilience4j" }

# Database & Migrations
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Telegram
telegram-bots-longpolling = { module = "org.telegram:telegrambots-longpolling", version.ref = "telegram-bots" }
telegram-bots-client = { module = "org.telegram:telegrambots-client", version.ref = "telegram-bots" }
telegram-bots-meta = { module = "org.telegram:telegrambots-meta", version.ref = "telegram-bots" }

# Testcontainers
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

# Тестирование: эмуляция внешних HTTP-сервисов
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

# Тестирование: ожидание асинхронных операций
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
