management:
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: priyut-coordination-bot
    distribution:
      percentiles:
        "[http.server.requests]": 0.95,0.99,0.999,1.0
  health:
    db:
      enabled: false